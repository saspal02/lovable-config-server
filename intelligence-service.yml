server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/intelligence_db
    username: ${PSQL_USER}
    password: ${PSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          # Free-tier codegen, live-verified 2026-10-10 (direct API probes).
          # DEAD/THROTTLED: deepseek-v4-flash-0731:free (404, paid slug only),
          # gemma-4-26b-a4b-it:free (429 shared pool), laguna-s-2.1:free (429),
          # north-mini-code:free (200 but loops read_files x40, writes nothing).
          # Fallback: poolside/laguna-s-2.1:free once its 429 clears.
          model: nvidia/nemotron-3-ultra-550b-a55b:free
          temperature: 0.2
          max-tokens: 8000
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    model.chat: openai
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          # Free-tier codegen, live-verified 2026-10-10 (direct API probes).
          # DEAD/THROTTLED: deepseek-v4-flash-0731:free (404, paid slug only),
          # gemma-4-26b-a4b-it:free (429 shared pool), laguna-s-2.1:free (429),
          # north-mini-code:free (200 but loops read_files x40, writes nothing).
          # Fallback: poolside/laguna-s-2.1:free once its 429 clears.
          model: nvidia/nemotron-3-ultra-550b-a55b:free
          temperature: 0.2
          max-tokens: 8000
