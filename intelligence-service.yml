server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/intelligence_db
    username: ${PSQL_USER}
    password: ${PSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          # Free-tier codegen, live-verified 2026-10-10 (direct API probe: 200 OK).
          # deepseek-v4-flash-0731:free is DEAD (404, use paid slug only) and
          # laguna-s-2.1:free 429s on the shared pool. Fallback:
          #   nvidia/nemotron-3-ultra-550b-a55b:free (1M ctx, verified 200 OK)
          model: cohere/north-mini-code:free
          temperature: 0.2
          max-tokens: 8000
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    model.chat: openai
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          # Free-tier codegen, live-verified 2026-10-10 (direct API probe: 200 OK).
          # deepseek-v4-flash-0731:free is DEAD (404, use paid slug only) and
          # laguna-s-2.1:free 429s on the shared pool. Fallback:
          #   nvidia/nemotron-3-ultra-550b-a55b:free (1M ctx, verified 200 OK)
          model: cohere/north-mini-code:free
          temperature: 0.2
          max-tokens: 8000
