server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/intelligence_db
    username: ${PSQL_USER}
    password: ${PSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    retry:
      max-attempts: 1
      on-client-errors: false
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      max-retries: 0
      chat:
        options:
          model: gemini-3.5-flash-lite
          temperature: 0.2
          max-tokens: 16384

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    model.chat: openai
    retry:
      max-attempts: 1
      on-client-errors: false
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      max-retries: 0
      chat:
        options:
          model: gemini-3.5-flash-lite
          temperature: 0.2
          max-tokens: 16384