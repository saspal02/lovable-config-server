server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/intelligence_db
    username: ${PSQL_USER}
    password: ${PSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          # Free-tier codegen (verified Sept 2026). Fallback if rate-limited/dead:
          #   poolside/laguna-s-2.1:free  (262K, coding-agent specialist)
          #   cohere/north-mini-code:free (256K, agentic coding model)
          model: deepseek/deepseek-v4-flash-0731:free
          temperature: 0.2
          max-tokens: 8000
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    model.chat: openai
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          # Free-tier codegen (verified Sept 2026). Fallback if rate-limited/dead:
          #   poolside/laguna-s-2.1:free  (262K, coding-agent specialist)
          #   cohere/north-mini-code:free (256K, agentic coding model)
          model: deepseek/deepseek-v4-flash-0731:free
          temperature: 0.2
          max-tokens: 8000
