# Shared config for ALL services (config-server serves this + <service>.yml merged).
# Ported from tutorial Anuj-Kumar-Sharma/lovable-config-server application.yml,
# adapted to this project (com.saswat.lovable).
#
# SECRET POLICY: this repo is PUBLIC. Real credentials must NEVER be committed.
# Every secret below is an ${ENV_VAR:dev-default} placeholder. The dev defaults
# boot a local machine for development only - override via environment for
# anything real (see k8s/infra/secrets.TEMPLATE.yaml in the main repo).

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: lovable-clone-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.saswat.lovable.*"


eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    enabled: true
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost

# Dev-only dummy (>= 32 chars for HS256). NOT FOR PRODUCTION - set JWT_SECRET env.
# Binds to both jwt.secretKey and jwt.secret-key via Spring relaxed binding.
jwt.secretKey: ${JWT_SECRET:local-dev-only-NOT-FOR-PRODUCTION-override-with-JWT_SECRET-env-0000}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080/frontend}
  preview:
    domain: ${PREVIEW_DOMAIN:localhost}
    namespace: ${PREVIEW_NAMESPACE:shuttle-apps}
    proxy-port: ${PROXY_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

---

spring:
  config:
    activate:
      on-profile: k8s
  kafka:
    bootstrap-servers: kafka.lovable-core.svc.cluster.local:9092
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt.secretKey: ${JWT_SECRET}

app:
  frontend:
    url: ${FRONTEND_URL}
  preview:
    domain: ${PREVIEW_DOMAIN}
    namespace: ${PREVIEW_NAMESPACE}
    proxy-port: ${PROXY_PORT}

ACCOUNT_SERVICE_URI: http://account-service
WORKSPACE_SERVICE_URI: http://workspace-service
INTELLIGENCE_SERVICE_URI: http://intelligence-service
